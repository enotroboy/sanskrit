name: 🌸 NRB Minecraft Launcher - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: 🚀 Build NRB Minecraft Launcher APK
    runs-on: ubuntu-latest

    steps:

      - name: 📥 Download project
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: 🔧 Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 📦 Extract project ZIP if needed
        shell: bash
        run: |
          echo "Checking repository..."

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "📦 ZIP found: $ZIP_FILE"
            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted
          else
            echo "ℹ️ No ZIP found. Using existing files."
          fi

      - name: 🔎 Locate Android project
        shell: bash
        run: |
          echo "Searching for Android project..."

          SETTINGS=$(find . -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo ""
            echo "❌ ERROR: settings.gradle was not found!"
            echo ""
            echo "Files currently in repository:"
            find . -maxdepth 4 -type f | sort
            echo ""
            echo "Please make sure the NRB Android project is uploaded."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "✅ Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: 🏗️ Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "📂 Project directory:"
          pwd

          echo ""
          echo "📄 Project files:"
          ls -la

          echo ""
          echo "🔧 Gradle version:"
          gradle --version

          echo ""
          echo "🚀 Building NRB Minecraft Launcher..."

          gradle --no-daemon clean assembleDebug

      - name: 🔍 Find APK
        shell: bash
        run: |
          echo "Searching for APK..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "❌ APK was not created!"
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "✅ APK CREATED SUCCESSFULLY!"
          echo "======================================"

          ls -lh "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NRB-Minecraft-Launcher-APK
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: 🎉 Build Complete
        run: |
          echo "======================================"
          echo "🎉 NRB MINECRAFT LAUNCHER APK READY!"
          echo "======================================"
          echo "📱 Download it from the Artifacts section."
