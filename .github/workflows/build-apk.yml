name: 🌸 NRB Minecraft Launcher - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: 🚀 Build NRB Minecraft Launcher APK
    runs-on: ubuntu-latest

    steps:

      - name: 📥 Download project
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: 🔧 Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 🔎 Find Android project
        shell: bash
        run: |
          echo "Searching for settings.gradle..."
          PROJECT_DIR=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "Using repository root"
            PROJECT_DIR="."
          fi

          echo "Android project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: 🏗️ Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Current directory:"
          pwd

          echo "Project files:"
          ls -la

          echo "Building APK..."

          gradle --no-daemon clean assembleDebug

      - name: 🔍 Check APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "app-debug.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "❌ APK was not created!"
            exit 1
          fi

          echo "✅ APK found:"
          ls -lh "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NRB-Minecraft-Launcher-APK
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: 🎉 Build Complete
        run: |
          echo "======================================"
          echo "🎉 NRB MINECRAFT LAUNCHER APK READY!"
          echo "======================================"
          echo "📱 Download it from Actions → Artifacts"
